# Tự động đóng gói phần mềm cho Windows (.exe) và macOS (.dmg + .zip)
name: Build Windows & Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cai thu vien
        run: npm install --no-audit --no-fund
      - name: Dong goi Windows
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: TronDeThi-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cai thu vien
        run: npm install --no-audit --no-fund
      - name: Dong goi Mac (zip)
        run: npx electron-builder --mac zip --arm64 --x64 --publish never
      - name: Dong goi Mac (dmg)
        continue-on-error: true
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: TronDeThi-Mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
